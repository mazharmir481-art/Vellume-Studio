<body class="text-[#0A0A0A] overflow-x-hidden selection:bg-[#0A0A0A] selection:text-[#F5F5F3]">
  
  <!-- Custom Cursor -->
  <div id="custom-cursor" class="hidden md:block"></div>

  <!-- Navigation -->
  <nav id="navbar" class="nav-blended flex items-center justify-between px-6 md:px-12 py-4 mix-blend-difference z-50">
    <a href="index.html" class="flex items-center gap-3 cursor-hover">

      <span class="font-heading font-black text-xl md:text-2xl tracking-tighter uppercase mt-1 hidden sm:block">VELLUME</span>
    </a>
    <a href="index.html" class="btn-nav cursor-hover px-5 py-2 font-mono-tech text-xs tracking-widest uppercase shrink-0">
      BACK HOME
    </a>
  </nav>

  <!-- Main Scroll Container -->
  <div data-scroll-container id="scroll-container">
    <main data-scroll-section class="w-full min-h-screen pt-32 pb-24 md:pt-48 md:pb-36 px-6 md:px-12 flex flex-col items-center justify-center">
      
      <div class="w-full max-w-4xl bg-white border-2 border-[#0A0A0A] shadow-[8px_8px_0px_#0A0A0A] p-6 sm:p-10 md:p-16">
        <h1 class="font-heading font-black text-4xl md:text-6xl tracking-tighter uppercase mb-2">LET'S BUILD IT</h1>
        <p class="font-mono-tech text-xs text-[#666666] tracking-widest uppercase mb-12">// PROJECT INQUIRY FORM</p>

        <form id="booking-form" action="https://formsubmit.co/hello@vellumestudio.com.au" method="POST" enctype="multipart/form-data" class="space-y-10 md:space-y-12 font-body font-medium text-sm md:text-base">
          <!-- FormSubmit Configuration -->
          <input type="hidden" name="_subject" value="New Project Inquiry - Vellume Studio">
          <input type="hidden" name="_captcha" value="false">
          
          <!-- Name -->
          <div class="flex flex-col space-y-2">
            <label for="name" class="uppercase tracking-wide text-[#666666] text-xs">My name is *</label>
            <input type="text" id="name" name="name" required class="cursor-hover w-full bg-transparent border-b-2 border-[#0A0A0A] py-3 px-2 focus:outline-none focus:border-[#0A0A0A] focus:bg-[#F5F5F3] transition-colors" placeholder="John Doe">
          </div>

          <!-- Company -->
          <div class="flex flex-col space-y-2">
            <label for="company" class="uppercase tracking-wide text-[#666666] text-xs">My company's name is *</label>
            <input type="text" id="company" name="company" required class="cursor-hover w-full bg-transparent border-b-2 border-[#0A0A0A] py-3 px-2 focus:outline-none focus:border-[#0A0A0A] focus:bg-[#F5F5F3] transition-colors" placeholder="Acme Corp">
          </div>

          <!-- Project Description -->
          <div class="flex flex-col space-y-2">
            <label for="project" class="uppercase tracking-wide text-[#666666] text-xs">A bit about my project</label>
            <textarea id="project" name="project" rows="4" class="cursor-hover w-full bg-transparent border-2 border-[#0A0A0A] p-4 focus:outline-none focus:bg-[#F5F5F3] transition-colors resize-y" placeholder="We need a new high-end website..."></textarea>
          </div>

          <!-- Contact Group -->
          <div class="border-2 border-[#0A0A0A] p-6 sm:p-8 bg-[#F5F5F3] space-y-8">
            <h3 class="font-mono-tech text-xs tracking-widest uppercase text-[#0A0A0A] mb-4">// CONTACT ME THROUGH</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div class="flex flex-col space-y-2">
                <label for="email" class="uppercase tracking-wide text-[#666666] text-xs">Email *</label>
                <input type="email" id="email" name="email" required class="cursor-hover w-full bg-transparent border-b-2 border-[#0A0A0A] py-2 px-2 focus:outline-none" placeholder="hello@company.com">
              </div>
              <div class="flex flex-col space-y-2">
                <label for="phone" class="uppercase tracking-wide text-[#666666] text-xs">Phone *</label>
                <input type="tel" id="phone" name="phone" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" pattern="[0-9]*" class="cursor-hover w-full bg-transparent border-b-2 border-[#0A0A0A] py-2 px-2 focus:outline-none" placeholder="0400000000">
              </div>
            </div>
          </div>

          <!-- File Upload -->
          <div class="flex flex-col space-y-2 border-2 border-dashed border-[#0A0A0A] p-6 text-center">
            <label for="brief" class="uppercase tracking-wide text-[#0A0A0A] text-sm cursor-hover cursor-pointer font-bold">Here's my brief (Max 5MB)</label>
            <input type="file" id="brief" name="brief" accept=".pdf,.doc,.docx,.pages" class="hidden">
            <p id="file-name-display" class="font-mono-tech text-xs text-[#666666] mt-2">No file selected.</p>
            <p id="file-error" class="font-mono-tech text-xs text-red-600 hidden font-bold mt-1">File exceeds 5MB limit.</p>
            <button type="button" id="btn-upload-trigger" class="cursor-hover btn-brutal btn-brutal-light mt-4 text-xs py-2 px-4 self-center mx-auto block">BROWSE FILES</button>
          </div>

          <!-- Legal / T&C -->
          <div class="flex items-start space-x-4 pt-4">
            <div class="flex items-center h-5 mt-0.5">
              <input id="terms" name="terms" type="checkbox" required class="w-5 h-5 text-[#0A0A0A] border-[#0A0A0A] rounded-none focus:ring-[#0A0A0A] cursor-hover">
            </div>
            <label for="terms" class="text-xs text-[#666666] uppercase tracking-wide leading-relaxed cursor-hover">
              I agree to the <a href="terms.html" class="text-[#0A0A0A] underline hover:text-[#0A0A0A]">Terms and Conditions</a> and <a href="privacy.html" class="text-[#0A0A0A] underline hover:text-[#0A0A0A]">Privacy Policy</a> *
            </label>
          </div>

          <!-- Submit -->
          <div class="pt-6">
            <button type="submit" class="w-full btn-brutal cursor-hover py-4 text-sm tracking-widest shadow-[4px_4px_0px_#0A0A0A] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_#0A0A0A]">
              SUBMIT INQUIRY
            </button>
          </div>
        </form>
      </div>
      
    </main>

    <!-- FOOTER -->
    <footer data-scroll-section class="border-t border-[#0A0A0A] bg-[#F5F5F3] py-6 px-6 md:px-12 relative z-10 font-mono-tech text-xs text-[#666666]">

            © 2026 VELLUME STUDIO // ADELAIDE
          </p>
          <span class="hidden sm:inline">//</span>
          <p>ELEVATING DIGITAL INFRASTRUCTURE</p>
        </div>
        <div class="flex flex-wrap items-center justify-center sm:justify-end gap-4 sm:gap-6 mt-4 sm:mt-0">
          <a href="terms.html" class="hover:text-[#0A0A0A] transition-colors cursor-hover">TERMS & CONDITIONS</a>
          <a href="privacy.html" class="hover:text-[#0A0A0A] transition-colors cursor-hover">PRIVACY POLICY</a>
          <a href="mailto:hello@vellumestudio.com.au" class="hover:text-[#0A0A0A] transition-colors cursor-hover">EMAIL</a>
          <a href="https://www.instagram.com/vellumestudios/" target="_blank" class="hover:text-[#0A0A0A] transition-colors cursor-hover flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            INSTAGRAM
          </a>
        </div>
      </div>
    </footer>
  </div>

  <script src="main.js"></script>
  <script>
    // Booking Form Specific Logic
    document.addEventListener('DOMContentLoaded', () => {
      const fileInput = document.getElementById('brief');
      const fileBtn = document.getElementById('btn-upload-trigger');
      const fileNameDisplay = document.getElementById('file-name-display');
      const fileError = document.getElementById('file-error');
      const form = document.getElementById('booking-form');

      if(fileBtn && fileInput) {
        fileBtn.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
          fileError.classList.add('hidden');
          if(e.target.files.length > 0) {
            const file = e.target.files[0];
            if(file.size > 5 * 1024 * 1024) { // 5MB limit
              fileError.classList.remove('hidden');
              fileNameDisplay.textContent = 'File too large.';
              fileInput.value = ''; // Reset
            } else {
              fileNameDisplay.textContent = file.name;
            }
          } else {
            fileNameDisplay.textContent = 'No file selected.';
          }
        });
      }

      if(form) {
        form.addEventListener('submit', (e) => {
          const fileError = document.getElementById('file-error');
          // Double check file size on submit just in case
          if(!fileError.classList.contains('hidden')) {
            e.preventDefault();
            alert("Please remove the oversized file before submitting.");
          }
          // Otherwise, allow the form to submit to formsubmit.co naturally!
        });
      }
    });
  </script>

  <!-- Sophiie AI Chatbot -->
  <script data-cfasync="false">
    (function () {
      try { window.sophiie?.chat?.destroy?.(); } catch (e) {}
      var loaded = false;
      function init() {
        if (loaded) return;
        loaded = true;
        window.sophiie.chat.load({
          orgId: 'org_sz7uYQbUEwLYuD891AuTfhhqX4P',
          render: { mode: 'overlay' }
        });
      }
      if (typeof window.sophiie?.chat?.load === 'function') { init(); return; }
      var s = document.createElement('script');
      s.async = true;
      s.type = 'module';
      s.setAttribute('data-cfasync', 'false');
      s.addEventListener('load', function () {
        if (typeof window.sophiie?.chat?.load === 'function') init();
        else console.error('[sophiie] chatbot bundle loaded but did not expose window.sophiie.chat.load');
      });
      s.addEventListener('error', function () { console.error('[sophiie] chatbot bundle failed to load'); });
      s.src = 'https://cdn.sophiie.ai/chatbot/bundle.mjs';
      (document.head || document.documentElement).appendChild(s);
      (function fallback() {
        if (loaded) return;
        if (typeof window.sophiie?.chat?.load === 'function') { init(); return; }
        setTimeout(fallback, 1000);
      })();
    })();
  </script>
